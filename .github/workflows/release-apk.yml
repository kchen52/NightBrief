name: Release APK

# Cut a versioned GitHub Release by pushing a tag that matches nightbrief.versionName:
#   git tag v0.1.2 && git push origin v0.1.2
# The in-app updater reads /releases/latest, so the tag and gradle.properties must agree.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Accept Android SDK licences
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$sdkmanager" --licenses >/dev/null || true
      - name: Tag must match nightbrief.versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          name="$(sed -n 's/^nightbrief.versionName=//p' gradle.properties | tr -d '[:space:]')"
          if [ "$tag" != "$name" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match nightbrief.versionName=$name"
            echo "::error::Every install would be told it is out of date."
            exit 1
          fi
          echo "::notice::tag and versionName agree on $name"
      - name: Decode release keystore
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not configured. See ci/README.md."
            exit 1
          fi
          ks_path="${RUNNER_TEMP}/nightbrief-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks_path"
          chmod 600 "$ks_path"
          echo "store_file=$ks_path" >> "$GITHUB_OUTPUT"
      - name: Build release APK
        env:
          NIGHTBRIEF_STORE_FILE: ${{ steps.signing.outputs.store_file }}
          NIGHTBRIEF_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          NIGHTBRIEF_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          NIGHTBRIEF_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -Pnightbrief.updateChannel=release --stacktrace
      - name: Clean up keystore
        if: always()
        env:
          KS_PATH: ${{ steps.signing.outputs.store_file }}
        run: |
          if [ -n "$KS_PATH" ] && [ -f "$KS_PATH" ]; then
            rm -f "$KS_PATH"
          fi
      - name: Name the APK after the tag
        id: apk
        run: |
          set -euo pipefail
          src="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          name="nightbrief-${GITHUB_REF_NAME}.apk"
          cp "$src" "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: nightbrief-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          prerelease=false
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=true
          fi
          gh release create "$GITHUB_REF_NAME" "$APK_PATH" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --latest=$([ "$prerelease" = true ] && echo false || echo true) \
            --prerelease=$prerelease \
            --notes "Signed release APK. After the first sideload, Tonight offers newer releases from its update banner. Play Store installs cannot be updated this way."
