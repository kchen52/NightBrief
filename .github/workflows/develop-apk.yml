name: Develop APK

# Builds the debug APK from the tip of develop and publishes it as the `develop-latest`
# pre-release, replacing the previous one. Debug-signed: there is no release keystore in CI.
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: develop-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # AGP installs a missing compile SDK itself once the licences are accepted.
      - name: Accept Android SDK licences
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$sdkmanager" --licenses >/dev/null || true
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Name the APK after the commit
        id: apk
        run: |
          set -euo pipefail
          name="nightbrief-develop-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: nightbrief-develop-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
      - name: Replace the develop-latest pre-release
        if: github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete develop-latest --cleanup-tag --yes || true
          gh release create develop-latest "${{ steps.apk.outputs.path }}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest develop build (${GITHUB_SHA::7})" \
            --notes "Debug-signed APK built from develop at ${GITHUB_SHA}. It cannot update a Play Store install."
