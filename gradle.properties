org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Phone release (Play). Bump versionCode for every upload. The watch stays on its own version.
nightbrief.versionCode=3
nightbrief.versionName=1.0.0

# AGP 9 defaults, kept off so the module scripts keep the kotlin-android plugin and the old DSL.
android.builtInKotlin=false
android.newDsl=false
