name: Release APK

# Cut a versioned GitHub Release by pushing a tag that matches nightbrief.versionName:
#   git tag v0.1.2 && git push origin v0.1.2
# The in-app updater reads /releases/latest, so the tag and gradle.properties must agree.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Accept Android SDK licences
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$sdkmanager" --licenses >/dev/null || true
      - name: Tag must match nightbrief.versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          name="$(sed -n 's/^nightbrief.versionName=//p' gradle.properties | tr -d '[:space:]')"
          if [ "$tag" != "$name" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match nightbrief.versionName=$name"
            echo "::error::Every install would be told it is out of date."
            exit 1
          fi
          echo "::notice::tag and versionName agree on $name"
      - name: Build release APK
        run: ./gradlew :app:assembleRelease -Pnightbrief.updateChannel=release --stacktrace
      - name: Name the APK after the tag
        id: apk
        run: |
          set -euo pipefail
          src="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          name="nightbrief-${GITHUB_REF_NAME}.apk"
          cp "$src" "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: nightbrief-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=false
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=true
          fi
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --latest=$([ "$prerelease" = true ] && echo false || echo true) \
            --prerelease=$prerelease \
            --notes "Sideload-signed APK. After the first install, Tonight offers newer releases from its update banner. Play Store installs cannot be updated this way."
